spring.application.name=prestamos-tecnouam

# Database (PostgreSQL). Password has no default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tecnouam}
spring.datasource.username=${DB_USER:tecnouam}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT: secret must come from the environment (min. 32 chars, validated at startup)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=2h

# CORS: comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Initial accounts (created only if missing). Passwords come from the environment.
app.users.admin-password=${ADMIN_PASSWORD:}
app.users.user-password=${USER_PASSWORD:}
