# Test profile: in-memory H2 in PostgreSQL mode. Flyway migrations are portable and run unchanged.
# All secrets below are obvious test dummies, not real credentials.
spring.datasource.url=jdbc:h2:mem:tecnouam;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.jwt.secret=test-only-dummy-secret-not-for-real-use-0123456789
app.jwt.expiration=1h
app.users.admin-password=test-admin-dummy
app.users.user-password=test-user-dummy
